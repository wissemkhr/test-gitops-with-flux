---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx-custom-helm-release
  namespace: flux-system
spec:
  chart:
    spec:
      chart: nginx-custom-chart
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: nginx-helm-chart-source
  interval: 10m0s
