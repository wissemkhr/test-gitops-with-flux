---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: react-app-kustomization
  namespace: flux-system
spec:
  interval: 30m0s
  path: ./manifests
  prune: true
  retryInterval: 2m0s
  sourceRef:
    kind: GitRepository
    name: react-app-source
  targetNamespace: default
  timeout: 3m0s
  wait: true
